<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link
      rel="stylesheet"
      href="%sveltekit.assets%/fonts/nanum-square-ac.css"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      // SSR tokens support forms without JavaScript. Remove only these injected
      // nodes before hydration; FormSecurityTokenInjector restores current tokens.
      document
        .querySelectorAll('input[data-shortlink-ssr-token]')
        .forEach((input) => input.remove());
    </script>
  </body>
</html>
